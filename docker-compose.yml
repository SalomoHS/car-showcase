version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=*
    restart: unless-stopped

  langfuse-metrics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "run_langfuse_metrics.py"]
    env_file:
      - ./backend/.env
    environment:
      - LANGFUSE_METRICS_INTERVAL=300
    restart: unless-stopped
    volumes:
      - ./backend/last_fetch_timestamp.json:/app/last_fetch_timestamp.json
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    depends_on:
      - backend
